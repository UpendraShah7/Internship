<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Events Practice</title>
</head>
<body>

    <h1>JavaScript Events Practice</h1>

    <button id="clickBtn">Click Me</button>

    <button id="dblClickBtn">Double Click Me</button>

    <div id="box">
        Move Mouse Here
    </div>

    <input type="text" id="keyboardInput" placeholder="Press a key">

    <input type="text" id="nameInput" placeholder="Type something">

    <select id="colorSelect">
        <option value="">Select Color</option>
        <option value="red">Red</option>
        <option value="blue">Blue</option>
        <option value="green">Green</option>
    </select>

    <form id="myForm">
        <input type="text" id="formInput" placeholder="Enter your name">
        <button type="submit">Submit</button>
    </form>

  
    <script src="javas3.js"></script>
</body>
</html>
