<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>User Management System</title>
    <link rel="stylesheet" href="crud.css" />
  </head>
  <body>
    <div class="page">
      <h1>User Management System (Fake API)</h1>
      <button id="btn-new-user" class="btn-primary">Create New User</button>

      <div
        class="card"
        id="user-form"
        style="display: none; margin-bottom: 20px"
      >
        <h2 id="form-title">Create New User</h2>
        <input type="hidden" id="u-id" />
        <div class="row">
          <div class="field">
            <label for="u-first">First name</label>
            <input id="u-first" />
          </div>
          <div class="field">
            <label for="u-last">Last name</label>
            <input id="u-last" />
          </div>
          <div class="field">
            <label for="u-email">Email</label>
            <input id="u-email" />
          </div>
          <div class="field" id="u-username-field">
            <label for="u-username">Username</label>
            <input id="u-username" />
          </div>
          <div class="field" id="u-password-field">
            <label for="u-password">Password</label>
            <input id="u-password" type="password" />
          </div>
          <div class="field">
            <label for="u-phone">Phone</label>
            <input id="u-phone" />
          </div>
          <div class="field">
            <label for="u-city">City</label>
            <input id="u-city" />
          </div>
        </div>
        <button
          id="btn-submit-user"
          class="btn-primary"
          style="margin-top: 12px"
        >
          Save User
        </button>
        <button id="btn-cancel-form" style="margin-top: 12px; display: none">
          Cancel
        </button>
        <div class="status" id="form-status"></div>
      </div>

      <div class="card">
        <h2>User List</h2>

        <table>
          <thead>
            <tr>
              <th>Full Name</th>
              <th>Email</th>
              <th>Phone</th>
              <th>City</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="user-table-body">
            <tr>
              <td colspan="5">Loading…</td>
            </tr>
          </tbody>
        </table>

        <div class="table-footer">
          <span>Total 1 users</span>

          <div class="pagination">
            <button class="page-arrow">&lt;</button>
            <span class="page-num">1</span>
            <button class="page-arrow">&gt;</button>
            <select class="page-size">
              <option>10 / page</option>
              <option>20 / page</option>
              <option>50 / page</option>
            </select>
          </div>
        </div>
      </div>
    </div>

    <script type="module" src="crud.js"></script>
  </body>
</html>
